services:
  backend:
    build:
      context: manu-gen/backend
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_PATH: /data/manu-gen.db
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - backend-data:/data
      - ./manu-gen/backend/src:/app/src
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)throw new Error('status '+r.status);return r.json()}).then(d=>console.log('ok',JSON.stringify(d))).catch(e=>{console.error(e.message);process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: manu-gen/frontend
    init: true
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      API_TARGET: http://backend:3000
    # Mount lockfiles from the host so new deps resolve in the container; run install on
    # each start (avoids stale anonymous node_modules volumes missing packages like react-router-dom).
    command: ["sh", "-c", "yarn install && exec yarn dev --host"]
    volumes:
      - ./manu-gen/frontend/src:/app/src
      # Writable: Yarn 4 may open yarn.lock for update during install even when unchanged.
      - ./manu-gen/frontend/package.json:/app/package.json
      - ./manu-gen/frontend/yarn.lock:/app/yarn.lock
      - ./manu-gen/frontend/.yarnrc.yml:/app/.yarnrc.yml
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)throw new Error('status '+r.status)}).catch(e=>{console.error(e.message);process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 45s

volumes:
  backend-data:
